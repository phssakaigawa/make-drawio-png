[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "make-drawio-png"
version = "0.1.0"
description = "Convert .drawio XML files into re-editable .drawio.png — zero external dependencies"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shoichiro Sakaigawa" }]
keywords = ["drawio", "diagrams", "png", "diagram-as-code", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.9"
# No runtime dependencies — pure Python standard library only

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/phssakaigawa/make-drawio-png"
Repository = "https://github.com/phssakaigawa/make-drawio-png"
"Bug Tracker" = "https://github.com/phssakaigawa/make-drawio-png/issues"
Changelog = "https://github.com/phssakaigawa/make-drawio-png/releases"

[project.scripts]
make-drawio-png = "make_drawio_png.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/make_drawio_png"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
